<div class="stei-panel">
  <div class="stei-header">
    <div>
      <div class="stei-title">SillyTavern 扩展迁移器</div>
      <div class="stei-subtitle">移动端优先使用 ZIP 导入。直接扫描 third-party 的一级扩展目录；manifest.json 可选，不会把 .git、src、dist、scripts、server-plugins 等嵌套目录误当成独立扩展。可一次选择多个 ZIP。</div>
    </div>
    <div class="stei-version">v0.6.3</div>
  </div>

  <div class="stei-toolbar">
    <button id="stei_pick" class="menu_button">📦 选择 ZIP</button>
    <button id="stei_rescan" class="menu_button" style="display:none">↻ 重新扫描</button>
<input id="stei_file_input" type="file" accept=".zip,application/zip,application/x-zip-compressed" multiple style="display:none" />
  </div>
  <div class="stei-file-hint">推荐把 SillyTavern/public/scripts/extensions/third-party/ 分成一个或多个 ZIP，再在这里一次选择。文件名不限，工具会自动识别扩展目录。</div>

  <div id="stei_status" class="stei-status stei-muted">尚未选择扩展。</div>

  <div id="stei_summary" class="stei-summary" style="display:none">
    <span id="stei_file_name"></span>
    <span id="stei_count"></span>
  </div>

  <div id="stei_list" class="stei-list"></div>

  <div id="stei_actions" class="stei-actions" style="display:none">
    <div class="stei-action-left">
      <button id="stei_select_all" class="menu_button">全选</button>
      <button id="stei_select_none" class="menu_button">全不选</button>
    </div>
    <button id="stei_import" class="menu_button stei-primary">一键导入</button>
  </div>

  <div id="stei_result" class="stei-result" style="display:none"></div>
</div>
